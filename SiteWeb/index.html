<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tourisme</title>

    <!-- Load Leaflet from CDN -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <!-- Load Esri Leaflet from CDN -->
    <script src="https://unpkg.com/esri-leaflet@3.0.19/dist/esri-leaflet.js"></script>

    <script src="https://unpkg.com/esri-leaflet-vector@4.3.2/dist/esri-leaflet-vector.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>
    <!--Pour les traiements géographiques-->

    <link rel="stylesheet" href="style.css">
    <script src="js/couchesFondCarte.js"></script>
    <script src="data/geojsonData.js"></script>
    <script src="cletoken.js"></script>
    <script src="js/traitementsGeo.js"></script>
</head>

<body>
    <div id="carte"></div>
    <div id="Titre" class="leaflet-bar">Carte touristique
        <div id="infosTouristiques">
            <p>La destination touristique la plus proche</p>
            <p id=nomDestinationTouristique class="infosTouristiques">Traitement en cours...</p>
            <p id=distanceDestinationTouristique class="infosTouristiques"></p>
        </div>

    </div>

    <script>
        const nomDestinationTouristique = document.getElementById("nomDestinationTouristique");
        const distanceDestinationTouristique = document.getElementById("distanceDestinationTouristique");
        const centreCarte = [46.748441, -71.779840];

        //Création de la carte de base
        const carte = L.map("carte", {
            zoomControl: false
        });
        //Ajout de l'imagerie
        imagerie.addTo(carte);
        //Point central de la carte
        carte.setView(centreCarte, 12);

        //Choix des fonds
        const fonds = {
            "OpenStreetMap": osm,
            "Topographique": OpenTopoMap,
            "Imagerie": imagerie
        }

        L.control.layers(fonds).addTo(carte);

        //Échelle
        L.control.scale({ 'imperial': false, 'maxWidth': 200, position:"topleft" }).addTo(carte);

        //Géolocalisation de l'usager
        //Création d'un groupe pour gérer la couche de localisation de l'usager
        let groupePosition = L.layerGroup().addTo(carte);
        let groupeTrajet = L.layerGroup().addTo(carte); //Pour les trajets

        //Ajout des données de la BD en format GeoJSON
        addGeoJson();

        //Icon pour la position de l'usager
        var myIcon = L.icon({
            iconUrl: 'images/monster.png',
            iconSize: [50, 50],
            iconAnchor: [25, 25],
            popupAnchor: [-3, -76]
        });

        function localisation() {
            //Suivi de la position
            carte.locate({ setView: false, watch: true })
                .on('locationfound', function (e) { //Lors de l'accès à la position de l'usager
                    carte.panTo([e.latitude, e.longitude]);//Déplace la carte
                    let marker = L.marker([e.latitude, e.longitude], {icon:myIcon});
                    //Efface les couches et les ajoute pour le rafraichissement
                    groupePosition.clearLayers();
                    groupePosition.addLayer(marker);
                    pointTourismePlusProcheUsager([parseFloat(e.longitude), parseFloat(e.latitude)]);    //Avec turf on trouve le plus proche
                })
                .on('locationerror', function (e) {
                    console.log(e);
                    alert("Problème avec la localisation"); //En cas d'erreur.
                });
        }

        localisation(); //Appel de la fonction

    </script>
</body>

</html>
