<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tourisme</title>

    <!-- Load Leaflet from CDN -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <!-- Load Esri Leaflet from CDN -->
    <script src="https://unpkg.com/esri-leaflet@3.0.19/dist/esri-leaflet.js"></script>

    <script src="https://unpkg.com/esri-leaflet-vector@4.3.2/dist/esri-leaflet-vector.js"></script>

    <link rel="stylesheet" href="style.css">
    <script src="js/couchesFondCarte.js"></script>
    <script src="cletoken.js"></script>


</head>

<body>
    <div id="carte"></div>
    <div id="Titre" class="leaflet-bar">Carte touristique
    </div>

    <script>
        const centreCarte = [46.748441, -71.779840];

        const fondRues = L.esri.Vector.vectorBasemapLayer("arcgis/outdoor", {
        token: cleAPI
      });

        //Création de la carte de base
        const carte = L.map("carte", {

        });
        //Ajout de l'imagerie
        imagerie.addTo(carte);
        //Point central de la carte
        carte.setView(centreCarte, 8);

        //Choix des fonds
        const fonds = {
            "OpenStreetMap": osm,
            "OpenStreetMap clair": Stadia_OSMBright,
            "Topographique": OpenTopoMap,
            "Imagerie": imagerie
        }


        L.control.layers(fonds).addTo(carte);

        //Échelle
        L.control.scale({ 'imperial': false, 'maxWidth': 400 }).addTo(carte);

        //Géolocalisation de l'usager
        //Création d'un groupe pour gérer la couche de localisation de l'usager
        let groupePosition = L.layerGroup().addTo(carte);
        function localisation() {
            //Suivi de la position
            carte.locate({ setView: true, watch: false })
                .on('locationfound', function (e) { //Lors de l'accès à la position de l'usager
                    let marker = L.circle([e.latitude, e.longitude], 2,{  //Symbole de positionnement
                        color: 'blue',
                        fillOpacity: 1
                    });
                    let circle = L.circle([e.latitude, e.longitude], e.accuracy / 2, { //Symbole pour la précision
                        weight: 0,
                        color: 'blue',
                        fillColor: 'blue',
                        fillOpacity: 0.2
                    });
                    //Efface les couches et les ajoute pour le rafraichissement
                    groupePosition.clearLayers(); 
                    groupePosition.addLayer(marker);
                    groupePosition.addLayer(circle);
                })
                .on('locationerror', function (e) {
                    console.log(e);
                    alert("Permission refusée!"); //En cas d'erreur.
                });
        }

        localisation(); //Appel de la fonction
    </script>
</body>

</html>
